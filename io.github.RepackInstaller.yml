app-id: io.github.RepackInstaller
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: run.sh

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=home
  - --filesystem=xdg-run/gvfsd
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: repack-installer
    buildsystem: simple
    build-commands:
      - install -Dm755 repack_installer.py /app/bin/repack_installer.py
      - install -Dm755 run.sh /app/bin/run.sh
      - install -Dm644 io.github.RepackInstaller.desktop
          /app/share/applications/io.github.RepackInstaller.desktop
    sources:
      - type: file
        path: repack_installer.py
      - type: file
        path: run.sh
      - type: file
        path: io.github.RepackInstaller.desktop
