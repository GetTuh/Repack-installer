name: Auto Version Bump

on:
  push:
    branches:
      - master

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next
        run: |
          git fetch --tags
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            ver="${latest#v}"
            IFS='.' read -r major minor patch <<< "$ver"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.next.outputs.version }}"
          git push origin "${{ steps.next.outputs.version }}"

      - name: Trigger build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag pushed using the default GITHUB_TOKEN does not trigger other
          # workflows (GitHub suppresses that to avoid recursive runs), so
          # build.yml's `push: tags: v*` trigger never fires on its own.
          # Dispatch it directly. Deliberately targeting `master` (not the new
          # tag) here: the auto-created `github-pages` deployment environment
          # restricts deployments to the default branch, so a run dispatched
          # against a tag ref silently fails to publish to Pages even though
          # the build+release steps succeed. master and the tag point at the
          # same commit at this point, so nothing is lost — the version is
          # passed explicitly instead of being inferred from the ref.
          gh workflow run build.yml --ref master -f version="${{ steps.next.outputs.version }}"
