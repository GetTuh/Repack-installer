name: Build Flatpak

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish as (e.g. v1.2.3). Leave empty for a "latest" build.'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb flatpak flatpak-builder

      - name: Add Flathub remote and pre-install SDK
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: repack-installer.flatpak
          manifest-path: io.github.GetTuh.RepackInstaller.yml
          cache-key: flatpak-builder-${{ github.sha }}
          repo-dir: repo

      - name: Update repo metadata
        run: flatpak build-update-repo repo

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'latest' }}
          name: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'Latest Build' }}
          files: repack-installer.flatpak

      - name: Assemble Pages site
        run: |
          mkdir -p site
          cp -r repo site/repo
          cp repackinstaller.flatpakrepo site/repackinstaller.flatpakrepo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
