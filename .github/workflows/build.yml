name: Build Flatpak

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb flatpak flatpak-builder

      - name: Add Flathub remote and pre-install SDK
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: repack-installer.flatpak
          manifest-path: io.github.GetTuh.RepackInstaller.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
          files: repack-installer.flatpak
